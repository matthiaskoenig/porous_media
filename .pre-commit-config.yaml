# Use the same locked tools locally, in hooks, and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        exclude: '^(data/|src/porous_media/resources/|docs/.*\.pdf$)'
      - id: detect-private-key
      - id: debug-statements
      - id: trailing-whitespace
        types_or: [python, pyi, toml, yaml, json, markdown, shell]
        exclude: '^(data/|src/porous_media/resources/|release-notes/|docs/images/)'
      - id: end-of-file-fixer
        types_or: [python, pyi, toml, yaml, json, markdown, shell]
        exclude: '^(data/|src/porous_media/resources/|release-notes/|docs/images/)'
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --group dev ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --group dev ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run --locked --group dev ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
