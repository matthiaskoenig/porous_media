[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "porous_media"
dynamic = ["version"]
description = "Python tools for porous media meshes, simulation data, and visualization."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["mit.txt"]
authors = [
    {name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
    {name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "modeling",
    "standardization",
    "theory of porous media",
    "TPM",
    "FEM",
]
dependencies = [
    "numpy>=2.4.4",
    "matplotlib>=3.10.8",
    "PyArrow>=23.0.1",
    "pandas>=3.0.2",
    "xarray>=2026.2.0",
    "openpyxl>=3.1.5",
    "rich>=14.3.3",
    "meshio>=5.3.5",
    "pyvista>=0.49.1",
    "scipy>=1.17.1",
    "dataclasses-json>=0.6.7",
    "jinja2>=3.1.6",
    "Pillow>=12.2.0",
    "h5py>=3.16.0",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "ruff>=0.16.6",
    "pre-commit>=4.6.2",
    "ty>=0.0.78",
    "tox>=4.61.2",
    "tox-uv>=1.36.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "build>=1.3.0",
    "twine>=6.2.0",
    "pandas-stubs>=3.0.0",
]
docs = [
    "zensical>=0.0.60",
    "mkdocstrings-python>=2.0.8",
]

[project.urls]
Homepage = "https://github.com/matthiaskoenig/porous_media"
Repository = "https://github.com/matthiaskoenig/porous_media"
Documentation = "https://matthiaskoenig.github.io/porous_media/"
Issues = "https://github.com/matthiaskoenig/porous_media/issues"
Download = "https://pypi.org/project/porous_media"

[tool.hatch.build.targets.wheel]
packages = ["src/porous_media"]

[tool.hatch.build]
# The small bundled examples include HDF5 files ignored for research outputs.
artifacts = ["src/porous_media/resources/**"]

[tool.hatch.build.targets.sdist]
# Research datasets and generated outputs are not part of a source release.
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/release-notes",
    "/README.md",
    "/CONTRIBUTING.md",
    "/RELEASE.md",
    "/mit.txt",
    "/cc-by-sa-4.0.txt",
    "/zensical.toml",
    "/tox.ini",
    "/.ruff.toml",
]

[tool.hatch.version]
path = "./src/porous_media/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["porous_media"]
omit = ["*/analyses/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.environment]
root = ["./src"]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.terminal]
error-on-warning = true
