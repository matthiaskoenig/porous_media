[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "porous_media"
dynamic = ["version"]
description = "Python tools for porous media meshes, simulation data, and visualization."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
    {name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "modeling",
    "standardization",
    "theory of porous media",
    "TPM",
    "FEM",
]
dependencies = [
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "xarray>=2026.9.0",
    "rich>=15.0.0",
    "meshio>=5.3.5",
    "pyvista>=0.49.1",
    "scipy>=1.18.1",
    "dataclasses-json>=0.6.7",
    "jinja2>=3.1.6",
    "Pillow>=13.0.0",
    "h5py>=3.16.0",
]

[dependency-groups]
dev = [
    {include-group = "research"},
    "bump-my-version>=1.6.3",
    "ruff>=0.17.1",
    "pre-commit>=4.7.0",
    "ty>=0.0.89",
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pandas-stubs>=3.0.5.260914",
]
research = [
    "pandas>=3.0.6",
    "PyArrow>=26.0.0",
    "openpyxl>=3.1.5",
]
docs = [
    "zensical>=0.0.71",
    "mkdocstrings-python>=2.0.9",
]

[project.urls]
Homepage = "https://github.com/matthiaskoenig/porous_media"
Repository = "https://github.com/matthiaskoenig/porous_media"
Documentation = "https://matthiaskoenig.github.io/porous_media/"
Issues = "https://github.com/matthiaskoenig/porous_media/issues"
Download = "https://pypi.org/project/porous_media"

[tool.hatch.build.targets.wheel]
packages = ["src/porous_media"]

[tool.hatch.build]
# The small bundled examples include HDF5 files ignored for research outputs.
artifacts = ["src/porous_media/resources/**"]

[tool.hatch.build.targets.sdist]
# Research datasets and generated outputs are not part of a source release.
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/AGENTS.md",
    "/LICENSE",
    "/CITATION.cff",
    "/zensical.toml",
    "/tox.ini",
    "/.ruff.toml",
]

[tool.hatch.version]
path = "./src/porous_media/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra"]
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
branch = true
source = ["porous_media"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.environment]
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "scripts", "research"]

[tool.ty.terminal]
error-on-warning = true
