version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
    commit-message:
      prefix: deps
