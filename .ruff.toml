target-version = "py313"
line-length = 88

[lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "D", "UP", "B", "C4", "SIM", "RET", "G", "PIE", "RUF",
]
# Scientific symbols and names such as König are intentional Unicode.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
