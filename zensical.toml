[project]
site_name = "porous_media"
site_url = "https://matthiaskoenig.github.io/porous_media/"
site_description = "Python utilities for porous media simulation results and meshes"
site_author = "Matthias König"
copyright = 'Copyright &copy; 2023-2026 <a href="https://livermetabolism.com">Matthias König</a>'
repo_url = "https://github.com/matthiaskoenig/porous_media"
repo_name = "matthiaskoenig/porous_media"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Quickstart" = "quickstart.md" },
  { "User guide" = [
    { "VTK and XDMF data" = "xdmf.md" },
    { "Mesh zonation" = "zonation.md" },
    { "Visualization and video" = "visualization.md" },
    { "FEBio workflows" = "febio.md" },
  ] },
  { "API reference" = [
    { "Overview" = "api/index.md" },
    { "Data" = "api/data.md" },
    { "Mesh" = "api/mesh.md" },
    { "Visualization" = "api/visualization.md" },
    { "FEBio" = "api/febio.md" },
  ] },
  { "Contributing" = "contributing.md" },
  { "Releases" = [
    { "Release process" = "release.md" },
    { "Release notes" = "release-notes/index.md" },
  ] },
  { "Development" = "development.md" },
  { "Research archive" = [
    { "Overview" = "research.md" },
    { "SPT analysis" = "research/spt.md" },
    { "Historical FEBio setup" = "run_febio_simulations.md" },
    { "Historical FEBio and RoadRunner build" = "build_roadrunner_febio.md" },
  ] },
]

[project.theme]
language = "en"
favicon = "images/favicon/favicon.ico"
logo = "images/favicon/porous_media-100x100-300dpi.png"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/porous_media"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/porous_media/"

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { returns_multiple_items = false }
docstring_section_style = "table"
show_source = false
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
