[tox]
requires = tox>=4.61, tox-uv>=1.36
envlist = ruff, ty, py313, py314, docs, build

[testenv]
runner = uv-venv-lock-runner
package = wheel
dependency_groups = dev
pass_env =
    UV_CACHE_DIR
    UV_PYTHON_INSTALL_DIR
set_env =
    MPLBACKEND = Agg
    PYVISTA_OFF_SCREEN = true
commands = pytest {posargs}

[testenv:ruff]
commands =
    ruff check .
    ruff format --check .

[testenv:ty]
commands = ty check

[testenv:docs]
dependency_groups = docs
commands = zensical build --clean --strict

[testenv:build]
dependency_groups = dev
commands =
    python -m build
    twine check --strict {toxinidir}/dist/*
